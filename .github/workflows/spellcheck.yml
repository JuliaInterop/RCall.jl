# adapted from https://github.com/JuliaDocs/Documenter.jl/blob/master/.github/workflows/SpellCheck.yml
# see docs at https://github.com/crate-ci/typos
name: Spell Check
on: [pull_request]

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: crate-ci/typos@v1.50.1
        with:
            config: _typos.toml
            write_changes: true
      - uses: reviewdog/action-suggester@v1.24.3
        with:
          tool_name: Typos
